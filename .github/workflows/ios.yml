name: Application iPhone

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compiler FaceScan.ipa
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcodebuild -version

      - name: Générer le projet Xcode
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compiler (Release, non signé)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project FaceScan.xcodeproj -scheme FaceScan \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*(Swift|swift)|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/FaceScan.app

      - name: Empaqueter en .ipa (à signer avec Sideloadly)
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FaceScan.app Payload/
          zip -qry FaceScan.ipa Payload
          ls -la FaceScan.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: FaceScan-ipa
          path: ios/FaceScan.ipa
          retention-days: 30

      - name: Publier la dernière version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ios/FaceScan.ipa \
            --title "FaceScan (dernière version)" \
            --notes "Compilé automatiquement depuis ${GITHUB_SHA::7}. Installer avec Sideloadly sur l'iPhone (voir README)." \
            --latest

      - name: Journal de compilation
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: ios/build.log
          retention-days: 7
